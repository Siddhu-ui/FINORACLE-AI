<!DOCTYPE html>
<html lang="en" data-theme="light" style="color-scheme: light;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FinOracle AI — Hybrid ML, Grounded RAG & Financial Scenario Intelligence Platform." />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>FinOracle AI — Financial Intelligence Platform</title>
    <script>
      // Apply the saved theme before first paint (default: light) to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('finoracle-theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
          root.classList.toggle('dark', theme === 'dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#080A0D' : '#FFFFFF');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
